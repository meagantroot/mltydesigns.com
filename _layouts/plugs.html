<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
{% include head.html %}
<style>
#svg-display {
    width: 120px;
    height: 120px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid red;
    background-color: #f0f0f0;
}

#svg-display svg {
    width: 120px;
    height: 120px;
    display: block;
}
</style>
<body data-font="Neucha|Cabin+Sketch">
{% include header.html %}

<div class="container py-4">

    <!-- Header -->
    <div class="mb-4">
        <h1 class="h3">
            {{ page.title }}
        </h1>
    </div>

    <!-- Controls -->
    <div class="row g-3 mb-4">
        <div class="col-md-6">
            <label class="form-label fw-semibold">Search by Plug Type:</label>
            <select id="plugDropdown" class="form-select"></select>
        </div>

        <div class="col-md-6">
            <label class="form-label fw-semibold">Search by Country:</label>
            <select id="countryDropdown" class="form-select"></select>
        </div>
    </div>

    <!-- Info Panel -->
    <div class="alert alert-light border-start border-4 border-primary d-flex align-items-center gap-3 mb-4">
        <div id="svg-display" class="flex-shrink-0"></div>
        <div id="info-text" class="me-3">
            Select a plug or country to begin.
        </div>
    </div>

    <!-- JUMBOTRON-STYLE MAP -->
    <div class="p-4 p-md-5 rounded-3 shadow-sm mb-4">
        <h5 class="mb-3">World Plug Map</h5>
        <div id="map-container"></div>
    </div>

    <!-- Table -->
    <div>
        <h5>Matching Countries</h5>
        <div class="table-responsive">
            <table class="table table-striped table-sm align-middle">
                <thead class="table-light">
                    <tr>
                        <th>Country</th>
                        <th>Plug Type(s)</th>
                    </tr>
                </thead>
                <tbody id="country-table-body">
                    <tr>
                        <td colspan="2" class="text-muted text-center">
                            No selection yet.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

  {% include scripts.html %}

  <script type="text/javascript">{% include /plugs/assets/js/plugs.js %}</script>

</body>
</html>
