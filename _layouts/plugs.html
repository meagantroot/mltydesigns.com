<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
{% include head.html %}
<body data-font="Neucha|Cabin+Sketch">

<div class="container py-4">

    <!-- Header -->
    <div class="mb-4">
        <h1 class="h3">
            Power Plug Explorer
            <small class="text-muted fs-6">v1.6.2</small>
        </h1>
    </div>

    <!-- Controls -->
    <div class="row g-3 mb-4">
        <div class="col-md-6">
            <label class="form-label fw-semibold">Search by Plug Type:</label>
            <select id="plugDropdown" class="form-select"></select>
        </div>

        <div class="col-md-6">
            <label class="form-label fw-semibold">Search by Country:</label>
            <select id="countryDropdown" class="form-select"></select>
        </div>
    </div>

    <!-- Info Panel -->
    <div class="alert alert-light border-start border-4 border-primary d-flex justify-content-between align-items-center mb-4">
        <div id="info-text">Select a plug or country to begin.</div>
        <div id="svg-display"></div>
    </div>

    <!-- JUMBOTRON-STYLE MAP -->
    <div class="bg-light p-4 p-md-5 rounded-3 shadow-sm mb-4">
        <h5 class="mb-3">World Plug Map</h5>
        <div id="map-container"></div>
    </div>

    <!-- Table -->
    <div>
        <h5>Matching Countries</h5>
        <div class="table-responsive">
            <table class="table table-striped table-hover table-sm align-middle">
                <thead class="table-light">
                    <tr>
                        <th>Country</th>
                        <th>Plug Type(s)</th>
                    </tr>
                </thead>
                <tbody id="country-table-body">
                    <tr>
                        <td colspan="2" class="text-muted text-center">
                            No selection yet.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.2.7/purify.min.js"></script>

<script src="{{ '/assets/js/bootstrap.bundle.min.js' | relative_url }}"></script>

  <script type="text/javascript">
    {% include "plugs/assets/js/plugs.js" %}
</script>

</body>
</html>
